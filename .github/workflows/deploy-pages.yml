# 소리노트 웹을 GitHub Pages(https://pajussanai.github.io/sori_note/)에 배포한다.
#
# main에 푸시하면 분석·테스트를 통과한 경우에만 웹 릴리스로 빌드해 배포한다.
# 앱에 들어가는 값은 lib/core/config.dart의 공개용 Supabase URL·publishable 키뿐이다.
# Gemini 키 등 비밀값은 Supabase Edge Function 비밀값에만 있고 여기서는 쓰지 않는다.
#
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를
# "GitHub Actions"로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고, 기다리던 것만 최신으로 바꾼다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web (release)
        run: flutter build web --release --base-href /sori_note/

      - name: Check build output
        run: |
          grep -q '<base href="/sori_note/">' build/web/index.html
          grep -q 'tkbhtdkhipmsmfwfhhom.supabase.co' build/web/main.dart.js
          # 클라이언트에 들어가면 안 되는 키가 없는지 확인한다.
          if grep -r -E -l 'sb_secret_[A-Za-z0-9_-]{6,}|AIza[0-9A-Za-z_-]{30,}' build/web; then
            echo "::error::빌드 결과물에 비밀 키로 보이는 값이 있습니다."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
