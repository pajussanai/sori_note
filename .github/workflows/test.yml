# 작업 브랜치와 PR에서 분석·테스트·웹 빌드만 확인한다(배포하지 않는다).
# 배포는 main에 반영될 때 deploy-pages.yml이 한다.
name: Test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /sori_note/

  # 새 DB 마이그레이션을 CI 안의 임시 로컬 Supabase(Docker)에서만 검증한다.
  # 운영 DB(tkbhtdkhipmsmfwfhhom)에는 연결하지 않는다.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Check migration on a local database
        run: |
          set +e
          bash tool/ci_db_check.sh 20261111090000 2>&1 | tee /tmp/db.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 실패 원인을 주석(annotation)으로 남긴다(로그는 로그인해야 볼 수 있으므로).
            msg=$(tail -n 60 /tmp/db.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=DB check failed::${msg}"
          fi
          exit "$status"
