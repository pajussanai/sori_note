<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    GitHub Pages(https://pajussanai.github.io/sori_note/)에서는
    `flutter build web --base-href /sori_note/`로 빌드해 이 값을 바꾼다.
    로컬 실행(flutter run)에서는 "/"가 들어간다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Flutter 엔진이 시작하면서 자기 viewport 설정으로 바꾼다. 로딩 화면용이다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="말로 기록하는 메모장 · Sori Note">
  <meta name="application-name" content="소리노트">
  <meta name="theme-color" content="#2E6E73">

  <!-- iOS 홈 화면 앱 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="소리노트">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>소리노트</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F7F5F0; }
    /* 앱이 첫 화면을 그릴 때까지 보이는 시작 화면 */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: #F7F5F0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #2B2D2F; transition: opacity .25s ease;
    }
    #splash .logo {
      width: 76px; height: 76px; border-radius: 50%; background: #2E6E73;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 14px rgba(0, 0, 0, .08);
    }
    #splash .name { font-size: 22px; font-weight: 700; }
    #splash .hint { font-size: 13px; color: #6E7378; }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="소리노트를 여는 중">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 11v2M8 7v10M12 3v18M16 7v10M20 11v2"/>
      </svg>
    </div>
    <div class="name">소리노트</div>
    <div class="hint" id="splash-hint">여는 중…</div>
  </div>
  <noscript>소리노트를 쓰려면 JavaScript를 켜 주세요.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
